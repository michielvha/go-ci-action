name: Go CI
description: Run blocking Go formatting, module, vet, test, build, and lint checks

inputs:
  working-directory:
    description: Go module directory within the checkout
    default: .
  go-version-file:
    description: Go version file relative to the module directory
    default: go.mod
  golangci-lint-config:
    description: Lint configuration relative to the module directory
    default: .golangci.yml

outputs:
  go-version:
    description: Resolved Go version for subsequent build or release actions
    value: ${{ steps.go.outputs.go-version }}

runs:
  using: composite
  steps:
    - name: Set up Go
      id: go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ inputs.working-directory }}/${{ inputs.go-version-file }}
        cache-dependency-path: ${{ inputs.working-directory }}/go.sum
    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.15.0
        install-only: true
        working-directory: ${{ inputs.working-directory }}
    - name: Format
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        formatting=$(gofmt -l .)
        printf '%s\n' "$formatting"
        test -z "$formatting"
    - name: Tidy modules
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go mod tidy -diff
    - name: Vet
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go vet ./...
    - name: Test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go test ./...
    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go build -o /dev/null ./...
    - name: Verify lint configuration
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LINT_CONFIG: ${{ inputs.golangci-lint-config }}
      run: golangci-lint config verify --config "$LINT_CONFIG"
    - name: Lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LINT_CONFIG: ${{ inputs.golangci-lint-config }}
      run: golangci-lint run --config "$LINT_CONFIG"

branding:
  icon: check-circle
  color: blue
